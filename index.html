<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Extra Life Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="overlay">

    <div id="tickerRow">
        <div id="ticker">
            Loading donations...
        </div>
    </div>

    <div id="donationSlot">
        <div id="donationPopup">
            <div id="popupTitle">NEW DONATION!</div>
            <div id="popupBody"></div>
            <div id="popupIncentive"></div>
        </div>
    </div>

    <div id="goalRow">

        <div id="goalText">
            Loading goal...
        </div>

        <div id="progressContainer">
            <div id="progressFill"></div>
        </div>

    </div>

</div>

<button id="testDonation">Test Donation</button>
<button id="testIncentives">Test Incentives Endpoint</button>

<script src="script.js"></script>

</body>
</html>
